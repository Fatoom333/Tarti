[project]
name = "Tarti"
version = "0.0.1"
description = "Simple cute avali-protogen, that will make your life easier"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.11.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
